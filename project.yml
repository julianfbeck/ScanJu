name: ScanJu
options:
  bundleIdPrefix: com.julianbeck
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    DEVELOPMENT_TEAM: VB9VC9U9AV
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  ScanJu:
    type: application
    platform: iOS
    sources: [ScanJu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julianbeck.ScanJu
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScanJu
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: ScanJu uses the cameras, LiDAR, and front TrueDepth sensor to capture room or object geometry, color, and textures. Scans stay on this device until you export them.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ScanJuTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ScanJuTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScanJu
schemes:
  ScanJu:
    build:
      targets:
        ScanJu: all
    test:
      targets: [ScanJuTests]
